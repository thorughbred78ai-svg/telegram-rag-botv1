name: Build and Deploy Telegram RAG Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telegram-rag-bot

jobs:

  # ==========================================================
  # Test
  # ==========================================================

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile app.py


  # ==========================================================
  # Build and Push
  # ==========================================================

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # ==========================================================
  # Deploy
  # ==========================================================

  deploy:
    name: Deploy Container
    runs-on: ubuntu-24.04
    needs: docker

    steps:

      - name: Deployment information
        run: |
          echo "Docker image successfully published:"
          echo "${{ env.IMAGE_NAME }}:latest"

      # ======================================================
      # Runtime deployment
      #
      # TODO:
      # Replace this section with the selected Container
      # Runtime deployment command/action.
      #
      # Runtime secrets should remain in the runtime.
      #
      # Required application secrets:
      #
      # TELEGRAM_BOT_TOKEN
      # TELEGRAM_WEBHOOK_SECRET
      # OPENROUTER_API_KEY
      # OPENROUTER_MODEL
      # QDRANT_URL
      # QDRANT_API_KEY
      # QDRANT_COLLECTION
      # EMBEDDING_MODEL
      # REDIS_URL
      #
      # Application configuration:
      #
      # RATE_LIMIT_REQUESTS
      # RATE_LIMIT_WINDOW
      # HISTORY_TURNS
      # QDRANT_TOP_K
