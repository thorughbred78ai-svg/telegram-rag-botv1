name: Build and Deploy Telegram RAG Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telegram-rag-bot

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile app.py


  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  deploy:
    name: Deploy Container
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Deployment information
        run: |
          echo "Docker image successfully published:"
          echo "${{ env.IMAGE_NAME }}:latest"

      # ======================================================
      # Runtime deployment
      #
      # 這裡不要放 Telegram / Redis / Qdrant / OpenRouter
      # Secret。
      #
      # Secrets 應該存在於 Container Runtime。
      #
      # 等你選定 Runtime 後，再把這裡替換成該 Runtime
      # 官方 deployment action / CLI。
      # ======================================================

      - name: Deployment placeholder
        run: |
          echo "Container image is ready."
          echo "Runtime deployment has not been configured yet."
