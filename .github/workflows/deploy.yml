name: Build and Deploy Telegram RAG Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telegram-rag-bot

jobs:

  # ==========================================================
  # Test
  # ==========================================================

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile app.py


  # ==========================================================
  # Build + Push GHCR
  # ==========================================================

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04

    needs:
      - test

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # ==========================================================
  # Render
  #
  # Render watches the GHCR image and performs the actual
  # runtime deployment.
  #
  # GitHub Actions does NOT receive runtime secrets.
  # ==========================================================

  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-24.04

    needs:
      - docker

    steps:

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not configured."
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            "$RENDER_DEPLOY_HOOK"

          echo
          echo "Render deployment triggered successfully."
